<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RX SIGNAL HACK - MINI PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background: #020617;
            color: #ffffff;
            overflow: hidden;
        }

        @keyframes premiumGlow {
            0% { border-color: #00ffcc; box-shadow: 0 0 25px rgba(0, 255, 204, 0.7), inset 0 0 15px rgba(0, 255, 204, 0.3); }
            33% { border-color: #7000ff; box-shadow: 0 0 25px rgba(112, 0, 255, 0.7), inset 0 0 15px rgba(112, 0, 255, 0.3); }
            66% { border-color: #ff007f; box-shadow: 0 0 25px rgba(255, 0, 127, 0.7), inset 0 0 15px rgba(255, 0, 127, 0.3); }
            100% { border-color: #00ffcc; box-shadow: 0 0 25px rgba(0, 255, 204, 0.7), inset 0 0 15px rgba(0, 255, 204, 0.3); }
        }

        /* Login Screen Style with Video Background & Fallback Gradient */
        #login-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
        }

        #login-bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
        }

        /* Fully Transparent, Blurry Minimalist Login Card */
        .login-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 320px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .login-input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            text-align: center;
            margin-bottom: 12px;
            outline: none;
            letter-spacing: 2px;
        }

        .login-input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        /* Transparent Glassmorphism Login Button */
        .login-btn {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: white;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            letter-spacing: 1.5px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
        }

        .login-btn:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.15);
        }

        .error-msg {
            color: #f87171;
            font-size: 11px;
            margin-top: 10px;
            display: none;
            font-weight: 700;
        }

        /* Main View Website Container */
        .app-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .market-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #020617;
        }

        /* Direct Floating Video Panel with Premium Look */
        #floating-panel {
            position: absolute;
            top: 50px;
            left: 15px;
            width: 240px;
            height: 480px;
            background: #000;
            border: 2px solid #00ffcc;
            animation: premiumGlow 4s infinite linear;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.95);
            z-index: 9999;
            user-select: none;
            touch-action: none;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        /* Minimized State */
        #floating-panel.minimized {
            width: 55px !important;
            height: 55px !important;
            border-radius: 50% !important;
            overflow: hidden;
            cursor: pointer;
        }

        #floating-panel.minimized .panel-header,
        #floating-panel.minimized .panel-body,
        #floating-panel.minimized #panel-bg-video {
            display: none !important;
        }

        #floating-panel.minimized::after {
            content: "RX";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #00ffcc, #7000ff);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 16px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* Crystal Clear Background Video */
        #panel-bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
            opacity: 1;
        }

        .panel-header {
            position: relative;
            z-index: 2;
            background: linear-gradient(90deg, rgba(0, 255, 204, 0.85), rgba(112, 0, 255, 0.85));
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #fff;
            cursor: move;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
        }

        /* Transparent Panel Body */
        .panel-body {
            position: relative;
            z-index: 2;
            flex: 1;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: transparent;
        }

        /* Floating Timer (High Quality Neon Style) */
        .floating-timer-container {
            text-align: center;
            width: 100%;
        }

        .floating-timer {
            font-size: 20px;
            font-weight: 800;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.8), 0 2px 4px rgba(0,0,0,0.9);
            letter-spacing: 2px;
        }

        /* Floating Period Number */
        .floating-period-container {
            text-align: center;
            width: 100%;
        }

        .floating-period-val {
            font-size: 16px;
            font-weight: 900;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.8), 0 2px 4px rgba(0,0,0,0.9);
            letter-spacing: 2px;
        }

        /* Signal Grid Layout - High Quality Glassmorphism Box with Neon Glow */
        .signal-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            width: 100%;
            text-align: center;
        }

        .sig-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            padding: 10px 5px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6), inset 0 0 10px rgba(255,255,255,0.05);
        }

        .sig-box strong {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 0 12px currentColor, 0 2px 5px rgba(0,0,0,0.9);
        }

        /* Premium Sleek Hide Button */
        .hide-btn {
            width: 90px;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 6px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 10px;
            cursor: pointer;
            text-align: center;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.5);
            transition: transform 0.2s;
        }

        .hide-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Login Screen with Video Background -->
    <div id="login-screen">
        <video id="login-bg-video" autoplay muted loop playsinline webkit-playsinline>
            <source src="https://files.catbox.moe/5qf9cc.mp4" type="video/mp4">
        </video>
        <div class="login-card">
            <input type="password" id="pass-input" class="login-input" placeholder="PASSCODE">
            <button class="login-btn" onclick="verifyPassword()">LOGIN</button>
            <div id="error-msg" class="error-msg">❌ Invalid or Expired Passcode!</div>
        </div>
    </div>

    <!-- Main View with Website & Floating Panel -->
    <div class="app-container">
        <!-- Website iframe -->
        <iframe src="https://dkwin9.com/#/register?invitationCode=55761163536" class="market-iframe"></iframe>

        <!-- Direct Floating Signal Panel with Video Background -->
        <div id="floating-panel" onclick="handlePanelClick(event)">
            <!-- Panel Background Video -->
            <video id="panel-bg-video" autoplay muted loop playsinline webkit-playsinline>
                <source src="https://files.catbox.moe/3upwx8.mp4" type="video/mp4">
            </video>

            <div class="panel-header">
                <span><i class="fas fa-bolt"></i> RX PRO HACK</span>
                <i class="fas fa-arrows-alt" style="font-size: 10px; opacity: 0.9;"></i>
            </div>

            <div class="panel-body">
                <!-- 1. Floating Timer at Top -->
                <div class="floating-timer-container">
                    <div id="cur-timer" class="floating-timer">00:00</div>
                </div>

                <!-- 2. Floating Period Number -->
                <div class="floating-period-container">
                    <div id="cur-period" class="floating-period-val">-----</div>
                </div>

                <!-- 3. Signals Layout (Pure Value, High Quality Neon Colors) -->
                <div class="signal-grid">
                    <div class="sig-box">
                        <strong id="sig-bs" style="color: #00ffcc;">--</strong>
                    </div>
                    <div class="sig-box">
                        <strong id="sig-num" style="color: #ff007f;">--</strong>
                    </div>
                    <div class="sig-box">
                        <strong id="sig-color" style="color: #38bdf8;">--</strong>
                    </div>
                </div>

                <!-- Minimalist Hide Button -->
                <button class="hide-btn" onclick="toggleMinimize(event)">HIDE</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://rx-signal-app-239a6-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ChatGPT Provided Debugging Code Added Here
        const v = document.getElementById("login-bg-video");
        if (v) {
            v.addEventListener("loadeddata", () => {
                console.log("Video Loaded Successfully");
            });
            v.addEventListener("error", (e) => {
                console.log("Video Error Occurred:", e);
            });
        }

        // Advanced Video Autoplay Force Handler for Mobile & Desktop
        function forcePlayVideos() {
            document.querySelectorAll('video').forEach(video => {
                video.muted = true;
                let playPromise = video.play();
                if (playPromise !== undefined) {
                    playPromise.catch(() => {
                        document.addEventListener('pointerdown', () => {
                            video.play();
                        }, { once: true });
                    });
                }
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            forcePlayVideos();
            checkAuthSession();
        });

        window.addEventListener('touchstart', () => {
            document.querySelectorAll('video').forEach(v => { if (v.paused) v.play(); });
        }, { once: true });

        window.addEventListener('click', () => {
            document.querySelectorAll('video').forEach(v => { if (v.paused) v.play(); });
        }, { once: true });

        async function hashString(message) {
            if (window.crypto && window.crypto.subtle) {
                try {
                    const msgBuffer = new TextEncoder().encode(message);
                    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                    const hashArray = Array.from(new Uint8Array(hashBuffer));
                    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                } catch (e) {}
            }
            return message;
        }

        function checkAuthSession() {
            const auth = sessionStorage.getItem("rx_auth");
            const key = sessionStorage.getItem("rx_auth_key");
            const time = sessionStorage.getItem("rx_token_time");

            if (auth === "true" && key && time && (Date.now() - parseInt(time) < 14400000)) {
                db.ref('passcodes/' + key).once('value').then(snap => {
                    if (snap.val()) {
                        document.getElementById("login-screen").style.display = "none";
                        initHackEngine();
                    } else {
                        sessionStorage.clear();
                    }
                });
            }
        }

        async function verifyPassword() {
            const val = document.getElementById("pass-input").value.trim();
            const err = document.getElementById("error-msg");
            if (!val) {
                err.innerText = "❌ Enter passcode!";
                err.style.display = "block";
                return;
            }

            try {
                const hashed = await hashString(val);
                const snap = await db.ref('passcodes').once('value');
                const data = snap.val();

                if (!data) {
                    err.innerText = "❌ No passcodes found!";
                    err.style.display = "block";
                    return;
                }

                let matchedKey = null;
                const now = Date.now();

                Object.keys(data).forEach(k => {
                    const item = data[k];
                    const exp = item.createdAt + (item.durationMinutes * 60 * 1000);
                    if ((item.password === hashed || item.password === val) && now < exp) {
                        matchedKey = k;
                    }
                });

                if (matchedKey) {
                    sessionStorage.setItem("rx_auth", "true");
                    sessionStorage.setItem("rx_auth_key", matchedKey);
                    sessionStorage.setItem("rx_token_time", Date.now().toString());
                    document.getElementById("login-screen").style.display = "none";
                    initHackEngine();
                } else {
                    err.innerText = "❌ Invalid or Expired Passcode!";
                    err.style.display = "block";
                }
            } catch (e) {
                err.innerText = "❌ Network error!";
                err.style.display = "block";
            }
        }

        function toggleMinimize(event) {
            event.stopPropagation();
            const panel = document.getElementById("floating-panel");
            panel.classList.toggle("minimized");
        }

        function handlePanelClick(event) {
            const panel = document.getElementById("floating-panel");
            if (panel.classList.contains("minimized")) {
                panel.classList.remove("minimized");
            }
        }

        const panel = document.getElementById("floating-panel");
        let isDragging = false, startX, startY, initialX, initialY, hasMoved = false;

        panel.addEventListener('mousedown', dragStart);
        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', dragEnd);

        panel.addEventListener('touchstart', dragStart, {passive: true});
        document.addEventListener('touchmove', drag, {passive: true});
        document.addEventListener('touchend', dragEnd);

        function dragStart(e) {
            isDragging = true;
            hasMoved = false;
            startX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            startY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
            initialX = panel.offsetLeft;
            initialY = panel.offsetTop;
        }

        function drag(e) {
            if (!isDragging) return;
            const currentX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
            const currentY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
            
            let dx = currentX - startX;
            let dy = currentY - startY;

            if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                hasMoved = true;
            }

            panel.style.left = `${initialX + dx}px`;
            panel.style.top = `${initialY + dy}px`;
        }

        function dragEnd() {
            isDragging = false;
        }

        function initHackEngine() {
            const API_URL = "https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json";
            let lastPeriod = null;

            async function fetchSignal() {
                try {
                    const res = await fetch(API_URL, { cache: "no-store" });
                    const json = await res.json();
                    if (json && json.data && json.data.list && json.data.list.length > 0) {
                        const history = json.data.list;
                        const latestIssue = history[0].issueNumber;
                        const nextIssue = (BigInt(latestIssue) + 1n).toString();

                        if (lastPeriod !== nextIssue) {
                            lastPeriod = nextIssue;
                            document.getElementById("cur-period").innerText = nextIssue;

                            let recentNums = history.slice(0, 10).map(item => parseInt(item.number));
                            let sum = recentNums.reduce((a, b) => a + b, 0);
                            let trendFactor = (sum + parseInt(nextIssue.slice(-2))) % 10;
                            
                            let predictionSize = trendFactor >= 5 ? "BIG" : "SMALL";
                            let targetNum = predictionSize === "BIG" ? [6, 7, 8, 9, 5][trendFactor % 5] : [1, 2, 3, 4, 0][trendFactor % 5];
                            let targetColor = targetNum % 2 === 0 ? "RED" : "GREEN";

                            document.getElementById("sig-bs").innerText = predictionSize;
                            document.getElementById("sig-bs").style.color = predictionSize === 'BIG' ? '#00ffcc' : '#ff007f';
                            
                            document.getElementById("sig-num").innerText = targetNum;
                            document.getElementById("sig-num").style.color = '#ffcc00';
                            
                            const colorEl = document.getElementById("sig-color");
                            colorEl.innerText = targetColor;
                            colorEl.style.color = targetColor === 'RED' ? '#ff416c' : '#00ffcc';
                        }
                    }
                } catch (e) {}
            }

            function runTimer() {
                const sec = new Date().getSeconds();
                const rem = 59 - sec;
                document.getElementById("cur-timer").innerText = `00:${rem < 10 ? '0' : ''}${rem}`;
                if (sec === 0 || sec === 2) {
                    fetchSignal();
                }
            }

            fetchSignal();
            setInterval(runTimer, 1000);
        }
    </script>
</body>
</html>
