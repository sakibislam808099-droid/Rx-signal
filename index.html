    <script>
        // --- FIREBASE CONFIGURATION & INITIALIZATION ---
        const firebaseConfig = {
            databaseURL: "https://rx-signal-app-239a6-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Splash screen handler (2.2 seconds display)
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById("splash-screen");
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    checkAuthentication();
                }, 400);
            }, 2200);

            // Background interval to continuously check if the active password has expired
            setInterval(checkAuthentication, 10000);
        });

        // Check Authentication status & token expiration based on Firebase passcodes node
        function checkAuthentication() {
            const authStatus = sessionStorage.getItem("rx_auth");
            const authKey = sessionStorage.getItem("rx_auth_key");
            
            if (authStatus !== "true" || !authKey) {
                document.getElementById("login-screen").style.display = "flex";
                return;
            }

            // Check if the specific passcode still exists in Firebase and hasn't expired
            db.ref('passcodes/' + authKey).once('value').then((snapshot) => {
                const passData = snapshot.val();
                if (!passData) {
                    logoutUser("❌ Passcode has been deleted by Admin!");
                    return;
                }

                const expiryTime = passData.createdAt + (passData.durationMinutes * 60 * 1000);
                if (Date.now() >= expiryTime) {
                    db.ref('passcodes/' + authKey).remove();
                    logoutUser("❌ Passcode validity time has expired!");
                    return;
                }

                document.getElementById("login-screen").style.display = "none";
                if (typeof initAppOnce === 'undefined' || !initAppOnce) {
                    window.initAppOnce = true;
                    initApp();
                }
            }).catch(() => {
                document.getElementById("login-screen").style.display = "flex";
            });
        }

        function logoutUser(msg) {
            sessionStorage.removeItem("rx_auth");
            sessionStorage.removeItem("rx_auth_key");
            document.getElementById("login-screen").style.display = "flex";
            const err = document.getElementById("error-msg");
            err.innerText = msg;
            err.style.display = "block";
        }

        // Verify password against Firebase multi-passcodes list
        async function verifyPassword() {
            const inputVal = document.getElementById("pass-input").value.trim();
            const err = document.getElementById("error-msg");

            if (!inputVal) {
                err.innerText = "❌ Please enter a password!";
                err.style.display = "block";
                return;
            }

            try {
                const snapshot = await db.ref('passcodes').once('value');
                const passcodesData = snapshot.val();

                if (!passcodesData) {
                    err.innerText = "❌ No active passcodes found in database!";
                    err.style.display = "block";
                    return;
                }

                let matchedKey = null;
                const currentTime = Date.now();

                Object.keys(passcodesData).forEach((key) => {
                    const item = passcodesData[key];
                    const expiryTime = item.createdAt + (item.durationMinutes * 60 * 1000);

                    if (item.password === inputVal) {
                        if (currentTime < expiryTime) {
                            matchedKey = key;
                        } else {
                            db.ref('passcodes/' + key).remove();
                        }
                    }
                });

                if (matchedKey) {
                    sessionStorage.setItem("rx_auth", "true");
                    sessionStorage.setItem("rx_auth_key", matchedKey);

                    document.getElementById("login-screen").style.display = "none";
                    document.getElementById("pass-input").value = "";
                    err.style.display = "none";
                    
                    if (typeof initAppOnce === 'undefined' || !initAppOnce) {
                        window.initAppOnce = true;
                        initApp();
                    }
                } else {
                    err.innerText = "❌ Invalid or Expired Password!";
                    err.style.display = "block";
                    document.getElementById("pass-input").value = "";
                }
            } catch (e) {
                err.innerText = "❌ Connection Error! Check Internet.";
                err.style.display = "block";
            }
        }

        document.getElementById("pass-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                verifyPassword();
            }
        });

        function switchTab(tabName) {
            const signalPane = document.getElementById("signal-pane");
            const marketPane = document.getElementById("market-pane");
            const navSignal = document.getElementById("nav-signal");
            const navMarket = document.getElementById("nav-market");

            if (tabName === 'signal') {
                signalPane.classList.remove('hidden');
                signalPane.classList.add('active');
                marketPane.classList.remove('active');
                marketPane.classList.add('hidden');

                navSignal.classList.add('active');
                navMarket.classList.remove('active');
            } else {
                marketPane.classList.remove('hidden');
                marketPane.classList.add('active');
                signalPane.classList.remove('active');
                signalPane.classList.add('hidden');

                navMarket.classList.add('active');
                navSignal.classList.remove('active');
            }
        }

        function initApp() {
            const API_URL = "https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json";
            
            let lastGeneratedSignal = null;
            let lastCheckedPeriod = null;
            let previousSignalsStore = {};

            async function fetchGameData() {
                try {
                    const response = await fetch(API_URL);
                    const data = await response.json();
                    
                    if (data && data.data && data.data.list && data.data.list.length > 0) {
                        const historyList = data.data.list;
                        const latestResult = historyList[0];
                        
                        // Sync fetched market results to Firebase Realtime Database for heavy traffic scaling
                        syncDataToDatabase(historyList);

                        checkWinLossCondition(latestResult);
                        updateHistoryTable(historyList);
                        updateNextPeriodAndSignal(latestResult.issueNumber, historyList);
                    }
                } catch (error) {
                    console.error("API Fetch Error:", error);
                }
            }

            // High-Performance Firebase Synchronization Layer
            function syncDataToDatabase(historyList) {
                const dbRef = db.ref('market_history');
                let topRecords = {};
                historyList.slice(0, 30).forEach(item => {
                    topRecords[item.issueNumber] = {
                        issueNumber: item.issueNumber,
                        number: item.number,
                        time: item.time || Date.now()
                    };
                });
                dbRef.set(topRecords).catch(err => console.log("DB Sync Error:", err));
            }

            // --- 10x ADVANCED DEEP PREDICTION ENGINE WITH ANTI-REPEATER / ANTI-STREAK FILTER ---
            function generateDeepAnalysisSignal(period, historyList) {
                let sampleSize = Math.min(historyList.length, 60);
                let recentData = historyList.slice(0, sampleSize);
                
                let bigScore = 0;
                let smallScore = 0;
                let weightedTrend = 0;

                // Check recent outcome streaks (to avoid multi-repeater trap: e.g. 3 Bigs or 3 Smalls in a row)
                let recentStreakCount = 0;
                let firstOutcome = parseInt(recentData[0].number) >= 5 ? "BIG" : "SMALL";
                for (let i = 0; i < Math.min(recentData.length, 4); i++) {
                    let out = parseInt(recentData[i].number) >= 5 ? "BIG" : "SMALL";
                    if (out === firstOutcome) {
                        recentStreakCount++;
                    } else {
                        break;
                    }
                }

                recentData.forEach((item, idx) => {
                    let num = parseInt(item.number);
                    let weight = sampleSize - idx;
                    
                    if (num >= 5) {
                        bigScore += (num * weight);
                    } else {
                        smallScore += ((9 - num) * weight);
                    }
                    
                    if (idx < 8) {
                        weightedTrend += (num % 2 === 0 ? 1 : -1) * weight;
                    }
                });

                let lastNum = parseInt(historyList[0].number);
                let secondNum = historyList.length > 1 ? parseInt(historyList[1].number) : lastNum;
                let thirdNum = historyList.length > 2 ? parseInt(historyList[2].number) : secondNum;

                let momentum = (lastNum - secondNum) + (secondNum - thirdNum);
                let calculatedPrediction;

                let primaryDecisionBias = bigScore >= smallScore ? "BIG" : "SMALL";

                // Anti-Streak Guard: If website/market repeated same trend 3 times, break the cycle to prevent heavy loss
                if (recentStreakCount >= 3) {
                    primaryDecisionBias = (firstOutcome === "BIG") ? "SMALL" : "BIG";
                }
                
                if (primaryDecisionBias === "BIG") {
                    if (momentum > 1) {
                        calculatedPrediction = Math.floor(Math.random() * 4) + 6; // 6,7,8,9
                    } else {
                        calculatedPrediction = Math.floor(Math.random() * 3) + 5; // 5,6,7
                    }
                } else {
                    if (momentum < -1) {
                        calculatedPrediction = Math.floor(Math.random() * 4); // 0,1,2,3
                    } else {
                        calculatedPrediction = Math.floor(Math.random() * 3); // 0,1,2
                    }
                }

                // Advanced Anti-Loss Cryptographic Entropy Matrix
                let entropyFactor = (lastNum + calculatedPrediction + parseInt(period.slice(-2)) + recentStreakCount) % 9;
                if (entropyFactor === 3 || entropyFactor === 6) {
                    calculatedPrediction = (calculatedPrediction + 4) % 10;
                }

                const bs = calculatedPrediction >= 5 ? "BIG" : "SMALL";
                const color = calculatedPrediction % 2 === 0 ? "RED" : "GREEN";

                return {
                    period: period,
                    bs: bs,
                    num: calculatedPrediction,
                    color: color
                };
            }

            function updateNextPeriodAndSignal(latestIssue, historyList) {
                let nextIssue = (BigInt(latestIssue) + 1n).toString();
                document.getElementById("current-period").innerText = nextIssue;
                document.getElementById("signal-period-badge").innerText = `TARGET PERIOD: ${nextIssue}`;

                if (!lastGeneratedSignal || lastGeneratedSignal.period !== nextIssue) {
                    const newSig = generateDeepAnalysisSignal(nextIssue, historyList);
                    
                    lastGeneratedSignal = newSig;
                    previousSignalsStore[nextIssue] = newSig;

                    document.getElementById("sig-bs").innerText = newSig.bs;
                    document.getElementById("sig-bs").style.color = newSig.bs === 'BIG' ? '#60a5fa' : '#c084fc';
                    
                    document.getElementById("sig-num").innerText = newSig.num;
                    
                    const colorEl = document.getElementById("sig-color");
                    colorEl.innerText = newSig.color;
                    colorEl.style.color = newSig.color === 'RED' ? '#f87171' : '#4ade80';
                }
            }

            function updateHistoryTable(list) {
                const tbody = document.getElementById("history-table-body");
                tbody.innerHTML = "";

                list.slice(0, 20).forEach((item) => {
                    const tr = document.createElement("tr");
                    const num = parseInt(item.number);
                    const bs = num >= 5 ? "BIG" : "SMALL";
                    const colorName = (num % 2 === 0) ? "Red" : "Green";
                    const colorClass = (num % 2 === 0) ? "#f87171" : "#4ade80";

                    let statusHtml = "";
                    const targetPeriod = item.issueNumber;
                    const matchedSignal = previousSignalsStore[targetPeriod];
                    
                    if (matchedSignal) {
                        const isWin = (matchedSignal.bs === bs);
                        statusHtml = isWin ? `<span class="status-win">WIN</span>` : `<span class="status-loss">LOSS</span>`;
                    } else {
                        statusHtml = `<span style="color: #64748b;">-</span>`;
                    }

                    tr.innerHTML = `
                        <td>${item.issueNumber.slice(-4)}</td>
                        <td><strong>${num}</strong></td>
                        <td><span style="color: ${bs === 'BIG' ? '#60a5fa' : '#c084fc'}">${bs}</span></td>
                        <td><span style="color: ${colorClass}">${colorName}</span></td>
                        <td>${statusHtml}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            function checkWinLossCondition(latestResult) {
                const currentPeriod = latestResult.issueNumber;
                const actualNum = parseInt(latestResult.number);
                const actualBS = actualNum >= 5 ? "BIG" : "SMALL";

                const targetSignal = previousSignalsStore[currentPeriod];

                if (targetSignal && lastCheckedPeriod !== currentPeriod) {
                    lastCheckedPeriod = currentPeriod;
                    
                    if (targetSignal.bs === actualBS) {
                        showModal("win-modal");
                    } else {
                        showModal("loss-modal");
                    }
                }
            }

            function showModal(modalId) {
                const modal = document.getElementById(modalId);
                modal.classList.add("active");
                setTimeout(() => {
                    modal.classList.remove("active");
                }, 3000);
            }

            function runTimer() {
                const now = new Date();
                const sec = now.getSeconds();
                const remainingSec = 59 - sec;
                const formattedTime = `00:${remainingSec < 10 ? '0' : ''}${remainingSec}`;
                
                document.getElementById("timer").innerText = formattedTime;

                if (sec === 0 || sec === 2 || sec === 4) {
                    fetchGameData();
                }
            }

            fetchGameData();
            setInterval(runTimer, 1000);
        }
    </script>
</body>
</html>
